name: Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outreach-product
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Write test environment
        run: |
          printf 'MISTRAL_API_KEY=%s\nBETTER_AUTH_SECRET=%s\nJOBKIT_RUNNER_TOKEN=%s\n' \
            "${{ secrets.MISTRAL_API_KEY }}" \
            "${{ secrets.BETTER_AUTH_SECRET }}" \
            "${{ secrets.JOBKIT_RUNNER_TOKEN }}" > .dev.vars
      - name: Worker types
        run: bunx wrangler types --check
      - name: Lint
        run: bunx ultracite check
      - name: File line caps
        run: bun cli/quality/check-file-lines.ts
      - name: Migration trigger guard
        run: bun cli/quality/check-migration-triggers.ts
      - name: Module manifest
        run: bun cli/quality/check-modules.ts
      - name: Test accounting
        run: bun cli/quality/check-tests.ts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Worker integration tests
        run: bunx vitest run --config tests/vitest.config.ts
      - name: Start integration tests
        run: bunx vitest run --config tests/start-vitest.config.ts
      - name: Build
        run: bun run build
