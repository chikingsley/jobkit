[project]
name = "job-search"
version = "0.1.0"
description = "Personal job-search workspace tooling for resumes and source records"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "weasyprint>=63",
  "pypandoc-binary>=1.13",
]

[dependency-groups]
dev = [
  "mdformat>=1.0.0",
  "mdformat-gfm>=1.0.0",
  "ruff>=0.15.13",
  "ty>=0.0.35",
]

[project.scripts]
build-resume = "jobkit.resume.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobkit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ty.environment]
root = ["./src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Ruff formatter compatibility:
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E111",
    "E114",
    "E117",
    "D203",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "COM812",
    "COM819",
    "ISC002",
    # pydocstyle alternative convention conflict; keep D212.
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"src/jobkit/resume/build.py" = ["T201"]
"tests/**" = ["PT009", "PT027", "S101"]
