url: ${JOBKIT_URL}
name: Select and clear an ANESL position
tags:
  - safe
  - applications
  - anesl
---
- runFlow: ../sign-in.yaml
- openLink: ${JOBKIT_URL}/anesl
- assertVisible: "Choose up to five positions"
- assertVisible: "MAESTRO-ANESL-001"
- tapOn: "MAESTRO-ANESL-001"
- assertVisible: ".*1 selected.*"
- tapOn: "MAESTRO-ANESL-001"
- assertVisible: ".*0 selected.*"
