url: ${JOBKIT_URL}
name: Create a multi-country campaign from the full local pool
tags:
  - safe
  - campaigns
---
- runFlow: ../sign-in.yaml
- openLink: ${JOBKIT_URL}/app/campaigns/markets/PL
- assertVisible: "Poland"
- tapOn: "Start campaign"
- assertVisible: "Choose target markets"
- assertVisible: "1 of 3 selected"
- tapOn: "China"
- tapOn: "Tajikistan"
- assertVisible: "3 of 3 selected. Remove one to change markets."
- assertVisible: "Campaign plan"
- swipe:
    start: 85%, 85%
    end: 85%, 30%
- assertVisible: "Approve the first five messages"
- tapOn:
    id: "create-campaign"
- assertVisible: "Live delivery is locked. Review and simulation remain available."
- assertVisible: "Review the first five"
- swipe:
    start: 85%, 85%
    end: 85%, 25%
- assertVisible: "Campaign pool"
- assertVisible: "Maestro University English Lecturer"
- assertVisible: "Maestro International School"
