<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>JobKit OCR benchmark A</title>
    <style>
    body {
      margin: 64px;
      font:
        18px / 1.55 system-ui,
        sans-serif;
      color: #111827;
    }
    h1 {
      margin-bottom: 28px;
      font-size: 28px;
    }
    dl {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 12px 24px;
    }
    dt {
      font-weight: 700;
    }
    dd {
      margin: 0;
    }
    </style>
  </head>
  <body>
    <h1>JOBKIT OCR BENCHMARK A</h1>
    <dl>
      <dt>Position</dt>
      <dd>English Teacher</dd>
      <dt>Location</dt>
      <dd>Tbilisi, Georgia</dd>
      <dt>Salary</dt>
      <dd>GEL 4,500 monthly</dd>
      <dt>Teaching hours</dt>
      <dd>18 weekly</dd>
      <dt>Housing</dt>
      <dd>Furnished apartment included</dd>
      <dt>Contact</dt>
      <dd>benchmark@example.test</dd>
      <dt>Reference</dt>
      <dd>SYNTH-A-2026</dd>
    </dl>
  </body>
</html>
