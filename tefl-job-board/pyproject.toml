[project]
name = "tefl-job-board"
version = "0.1.0"
description = "TEFL and ESL job-board ingestion into the local job-search database"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "ruff>=0.15.13",
  "ty>=0.0.35",
]

[project.scripts]
jobs = "jobkit.jobs.db_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobkit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ty.environment]
root = ["./src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "W191",
  "E111",
  "E114",
  "E117",
  "D203",
  "D206",
  "D300",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "COM812",
  "COM819",
  "ISC002",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"src/jobkit/jobs/db_cli.py" = ["T201"]
